name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  preview-comment:
    name: Build & Comment
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Build Status\n\n Build succeeded! Ready for review.\n\n**Build Details:**\n- Node.js: 20.x\n- Build: Static Export (Next.js)\n- Status: Success'
            })
